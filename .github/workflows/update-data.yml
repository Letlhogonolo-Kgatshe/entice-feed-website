name: Update climate & market data

on:
  schedule:
    - cron: '0 5 * * 1'   # every Monday 05:00 UTC (07:00 SAST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
        working-directory: scripts
      - run: node scripts/update-data.mjs
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add data/agri-data.json
          git commit -m "Refresh climate and market data ($(date -u +%Y-%m-%d))"
          git push
